<body>
<p id="status">Smoelenboek laden…</p>
<script>
fetch("smoelenboek.html?v=" + Date.now(), { cache: "no-store" })
  .then((antwoord) => {
    if (!antwoord.ok) throw new Error(antwoord.status);
    return antwoord.text();
  })
  .then((pagina) => {
    document.open();
    document.write(pagina);
    // StatiCrypt start op window.onload. Chrome vuurt die na document.close() opnieuw af,
    // niet elke browser doet dat; start hem dan zelf, maar nooit twee keer.
    let gestart = false;
    window.addEventListener("load", () => { gestart = true; });
    document.close();
    setTimeout(() => {
      if (!gestart && typeof window.onload === "function") window.onload(new Event("load"));
    }, 500);
  })
  .catch(() => {
    document.getElementById("status").textContent = "Het smoelenboek kon niet worden geladen. Probeer het opnieuw.";
  });
</script>
